name: CI ObRail Europe

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: obrail
          POSTGRES_USER: obrail
          POSTGRES_PASSWORD: obrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obrail -d obrail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: obrail
      DB_USER: obrail
      DB_PASSWORD: obrail

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter les tests automatisés
        run: |
          pytest -v